on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

name: Check image updates

permissions:
  contents: write
  packages: write

jobs:
  update:
    name: Check image updates
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.check-for-updates.outputs.changes_detected }}
      commit_hash: ${{ steps.auto-commit-action.outputs.commit_hash }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Check for updates
        id: check-for-updates
        run: '"${GITHUB_WORKSPACE}/.github/updateDockerfile.sh"'

      - name: Set up Docker Buildx
        if: steps.check-for-updates.outputs.changes_detected == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker Image
        if: steps.check-for-updates.outputs.changes_detected == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          push: false
          context: .
          cache-from: type=gha,scope=docker-omsa
          cache-to: type=gha,mode=max,scope=docker-omsa
          provenance: false

      - name: Push changed file
        id: auto-commit-action
        if: steps.check-for-updates.outputs.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
            commit_message: Update Dockerfile (${{ steps.check-for-updates.outputs.changed_items }})
            file_pattern: 'Dockerfile'

  build-and-push:
    uses: ./.github/workflows/build-and-push.yml
    needs: update
    secrets: inherit
    if: needs.update.outputs.changes_detected == 'true'
    with:
      tags: dev-latest
      ref: ${{ needs.update.outputs.commit_hash }}

