name: Build and Push

on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
      ref:
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_PASSWORD:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tags:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    concurrency: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to registry.shanemcc.net
        if: ${{ inputs.push }}
        uses: docker/login-action@v4.6.0
        with:
          registry: registry.shanemcc.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate tag list
        id: tags
        env:
          IMAGES: "docker.io/shanemcc/docker-omsa ghcr.io/shanemcc/docker-omsa registry.shanemcc.net/public/docker-omsa"
          TAGS: ${{ inputs.tags }}
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "TAGS<<$EOF" >> "$GITHUB_OUTPUT"
          for IMAGE in ${IMAGES}; do
            for TAG in ${TAGS}; do
              echo "${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
            done
          done
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: ${{ inputs.push }}
          context: .
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha,scope=docker-omsa
          cache-to: type=gha,mode=max,scope=docker-omsa
          provenance: false
